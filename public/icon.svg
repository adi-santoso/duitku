<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c131d"/>
      <stop offset="100%" style="stop-color:#141f2e"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4f58c"/>
      <stop offset="100%" style="stop-color:#70a214"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9d8a"/>
      <stop offset="100%" style="stop-color:#ff5733"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="url(#limeGrad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Abstract Geometric Financial Card & Coin Icon -->
  <g transform="translate(0, -10)">
    <!-- Coral Accent Card Backing -->
    <rect x="126" y="130" width="260" height="170" rx="32" fill="url(#coralGrad)" opacity="0.85" transform="rotate(-8 256 215)"/>
    
    <!-- Primary Lime Hero Wallet Card -->
    <rect x="116" y="160" width="280" height="180" rx="36" fill="url(#limeGrad)" filter="url(#glow)"/>

    <!-- Wallet Card Inner Detail Ring -->
    <circle cx="340" cy="250" r="32" fill="#0c131d" opacity="0.9"/>
    <circle cx="340" cy="250" r="16" fill="url(#limeGrad)"/>

    <!-- Bold Symbol 'Rp' inside Card -->
    <text x="160" y="275" font-family="'Manrope', 'DM Sans', sans-serif" font-weight="900" font-size="92" fill="#0c131d" letter-spacing="-2">Rp</text>
  </g>

  <!-- Title Text 'DuitKu' -->
  <text x="256" y="420" text-anchor="middle" font-family="'Manrope', 'DM Sans', sans-serif" font-weight="800" font-size="64" fill="#ffffff" letter-spacing="-1">DuitKu</text>
  
  <!-- Subtle Lime Progress Accent Pill below -->
  <rect x="196" y="445" width="120" height="10" rx="5" fill="url(#limeGrad)"/>
</svg>
